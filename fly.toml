# fly.toml app configuration file generated for premierleaguepredictions2627 on 2026-08-11T22:11:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'premierleaguepredictions2627'
primary_region = 'ord'

[build]

[env]
  DATABASE_PATH = '/data/epl.db'
  PORT = '8080'

# Accounts and predictions live in a SQLite file on this volume. A volume
# attaches to exactly one machine, so keep this app at one machine — deploy
# with `fly deploy --ha=false` and don't `fly scale count` above 1 without
# moving to a networked database first.
[[mounts]]
  source = 'epl_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
