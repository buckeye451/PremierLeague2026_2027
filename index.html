<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>EPL Predictions 2026/27</title>
    <meta name="description" content="Make your Premier League 2026/27 table prediction and track it against the live standings alongside your friends." />

    <!-- Rich link previews (iMessage, WhatsApp, Slack, Twitter).
         These live in index.html rather than being set by React on purpose:
         link-preview scrapers don't run JavaScript, so anything rendered by
         the app is invisible to them.

         og:image must be an absolute URL. If you ever put a custom domain in
         front of this app, change the three absolute URLs below to match. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EPL Predictions" />
    <meta property="og:title" content="EPL Predictions 2026/27" />
    <meta property="og:description" content="Predict the final Premier League table, then watch it get dismantled by reality. Picks lock Fri 21 Aug, 3:00 PM ET." />
    <meta property="og:url" content="https://premierleaguepredictions2627.fly.dev/" />
    <meta property="og:image" content="https://premierleaguepredictions2627.fly.dev/link-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EPL Predictions 2026/27" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EPL Predictions 2026/27" />
    <meta name="twitter:description" content="Predict the final Premier League table, then watch it get dismantled by reality." />
    <meta name="twitter:image" content="https://premierleaguepredictions2627.fly.dev/link-preview.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3D195B" />
    <meta name="background-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EPL Predict" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />

    <style>
      body { margin: 0; background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").then(
            (reg) => console.log("SW registered:", reg.scope),
            (err) => console.log("SW registration failed:", err)
          );
        });
      }
    </script>
  </body>
</html>
